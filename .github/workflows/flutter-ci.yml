name: Flutter CI

on:
  push:
    branches: [main]
    paths:
      - "flutter/**"
      - "assets/**"
      - ".github/workflows/flutter-ci.yml"
  pull_request:
    paths:
      - "flutter/**"
      - "assets/**"
      - ".github/workflows/flutter-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
