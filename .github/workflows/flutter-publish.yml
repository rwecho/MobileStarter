name: Flutter Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    env:
      # Optional: base64-encoded release keystore. When unset, the release APK
      # is signed with the debug keys (still installable for testing).
      FLUTTER_KEYSTORE: ${{ secrets.FLUTTER_KEYSTORE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Configure release signing
        if: ${{ env.FLUTTER_KEYSTORE != '' }}
        env:
          STORE_PASSWORD: ${{ secrets.FLUTTER_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLUTTER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FLUTTER_KEY_PASSWORD }}
        run: |
          printf '%s' "$FLUTTER_KEYSTORE" | base64 -d > android/app/keystore.jks
          printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: flutter/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
