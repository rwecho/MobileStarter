name: Flutter Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    env:
      # Optional: base64-encoded release keystore. When unset, the release APK
      # is signed with the debug keys (still installable for testing).
      FLUTTER_KEYSTORE: ${{ secrets.FLUTTER_KEYSTORE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Configure release signing
        if: ${{ env.FLUTTER_KEYSTORE != '' }}
        env:
          STORE_PASSWORD: ${{ secrets.FLUTTER_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLUTTER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FLUTTER_KEY_PASSWORD }}
        run: |
          printf '%s' "$FLUTTER_KEYSTORE" | base64 -d > android/app/keystore.jks
          printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
      - name: Build release APK
        # 发布身份（必填）：app_id（租户）与 environment 通过 --dart-define 注入，
        # 未配置则构建出的 App 启动即崩。取值优先 GitHub Variables，其次 Secrets；
        # environment 发布默认 production。
        env:
          APP_ID: ${{ vars.APP_ID || secrets.APP_ID }}
          APP_ENVIRONMENT: ${{ vars.APP_ENVIRONMENT || secrets.APP_ENVIRONMENT || 'production' }}
        run: |
          if [ -z "$APP_ID" ]; then
            echo "::error::APP_ID 未配置：请在仓库 Variables 或 Secrets 中设置 APP_ID 后再发布，不能为空。"
            exit 1
          fi
          flutter build apk --release \
            --dart-define=MOBILEUI_APP_ID="$APP_ID" \
            --dart-define=MOBILEUI_APP_ENVIRONMENT="$APP_ENVIRONMENT"
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: flutter/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
