name: React Native CI

on:
  push:
    branches: [main]
    paths:
      - "react-native/**"
      - "assets/**"
      - ".github/workflows/react-native-ci.yml"
  pull_request:
    paths:
      - "react-native/**"
      - "assets/**"
      - ".github/workflows/react-native-ci.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-native/package-lock.json
      - run: npm ci
      - run: npm run typecheck
