name: mobilestarter_flutter
description: Reusable MobileStarter application template
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^17.0.0
  app_settings: ^8.0.3
  firebase_analytics: ^12.4.5
  firebase_core: ^4.12.1
  firebase_crashlytics: ^5.2.6
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.3.0
  flutter_web_auth_2: ^4.1.0
  google_sign_in: ^6.2.1
  http: ^1.6.0
  image_picker: ^1.1.2
  in_app_purchase: ^3.3.0
  shared_preferences: ^2.5.5
  sign_in_with_apple: ^6.1.4
  video_player: ^2.9.5
  firebase_messaging: ^16.6.0
  # 通用外链（官网/评分/网页版协议）：对齐 RN expo-web-browser、ArkTS openLink 的端能力预置。
  # 当前无调用点，首个外链业务接入时直接 launchUrl 使用，勿因"暂无调用"清理。
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # test/widget_test.dart mocks the async shared_preferences platform.
  shared_preferences_platform_interface: ^2.4.0
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/illustrations/
